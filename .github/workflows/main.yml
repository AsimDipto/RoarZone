name: RoarZone Fast Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'roarzone.zip'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y p7zip-full
          pip install requests

      - name: Extract and Run
        run: |
          mkdir -p tmp_yt
          7z x roarzone.zip -p"${{ secrets.ROARZONE_ZIP_PASSWORD }}" -y -otmp_yt
          python3 tmp_yt/roar.py
          rm -rf tmp_yt

      - name: Commit and Push
        run: |
          git config --global user.name "Asim Dipto"
          git config --global user.email "asimdipto@github.com"
          git add "RoarZone-Playlist.m3u"
          if git diff --staged --quiet; then
            echo "Nothing to push."
          else
            git commit -m "RoarZone Sync: $(date +'%H:%M:%S')"
            git pull origin main --rebase
            git push origin main
          fi

      - name: Instant Loop
        # ১ মিনিট বিরতি দিয়ে আবার রান হবে
        run: |
          sleep 60
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/roar_update.yml/dispatches \
          -d '{"ref":"main"}' || echo "Loop failed"
